<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Orbit">
  <defs>
    <linearGradient id="orbCore" x1="24" y1="23" x2="40" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46c35c"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="orbRing" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2ea043" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#2ea043" stop-opacity=".5"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <!-- tilted orbit ring (3D feel via the top-dim/bottom-bright gradient) -->
  <ellipse cx="32" cy="32" rx="23" ry="8.6" transform="rotate(-28 32 32)"
           stroke="url(#orbRing)" stroke-width="2.6"/>
  <!-- planet core -->
  <circle cx="32" cy="32" r="8.8" fill="url(#orbCore)"/>
  <circle cx="28.9" cy="28.9" r="2.6" fill="#eafff0" fill-opacity=".38"/>
  <!-- satellite riding the ring (upper-right) with a soft halo -->
  <circle cx="48.7" cy="19" r="6.4" fill="#46c35c" fill-opacity=".16"/>
  <circle cx="48.7" cy="19" r="3.4" fill="#46c35c"/>
</svg>
