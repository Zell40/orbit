# Woodpecker CI (Codeberg) — runs on every push and pull request.
# Enable once at https://ci.codeberg.org → add the "orbit" repo.
when:
  - event: [push, pull_request]

steps:
  install:
    image: node:24-alpine
    commands:
      - npm ci

  lint:
    image: node:24-alpine
    commands:
      - npm run lint
    depends_on: [install]

  test:
    image: node:24-alpine
    commands:
      - npm run test
    depends_on: [install]

  build:
    image: node:24-alpine
    commands:
      - npm run build   # tsc -b (typecheck) + vite build
    depends_on: [install]
